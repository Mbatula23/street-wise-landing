name: Site QA

on:
  push:
    branches: [claude/site-qa]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Pages config (GitHub's view)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages || true

      - name: DNS
        run: |
          for h in murphy-street.com www.murphy-street.com; do echo "== $h"; dig +short A $h; dig +short CNAME $h; dig +short AAAA $h; done
          echo "== CAA"; dig +short CAA murphy-street.com

      - name: TLS certificate served for each host
        run: |
          for h in murphy-street.com www.murphy-street.com; do
            echo "== $h"
            echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || echo "no cert"
          done

      - name: HTTP responses
        run: |
          for u in http://murphy-street.com/ https://murphy-street.com/ http://www.murphy-street.com/ https://www.murphy-street.com/ https://murphy-street.com/privacy-policy https://murphy-street.com/login https://murphy-street.com/media/london.mp4; do
            printf '%-45s ' "$u"
            curl -s -o /dev/null -m 20 -w '%{http_code} -> %{redirect_url}\n' "$u" || echo "FAILED (curl exit $?)"
          done
          echo "== homepage title"; curl -sk -m 20 http://murphy-street.com/ | grep -o '<title>[^<]*</title>' || true

      - name: Browser render
        run: |
          npm i --no-save playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          for (const [name, url, w, h] of [
            ['https-desktop','https://murphy-street.com/',1440,900],
            ['http-desktop','http://murphy-street.com/',1440,900],
            ['https-mobile','https://murphy-street.com/',390,844],
            ['www','https://www.murphy-street.com/',1440,900],
          ]) {
            const p = await b.newPage({ viewport: { width: w, height: h } });
            try {
              const r = await p.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
              await p.waitForTimeout(3000);
              const info = await p.evaluate(() => {
                const v = document.querySelector('video');
                return { title: document.title, h1: document.querySelector('h1')?.textContent,
                         strap: document.querySelector('main p')?.textContent,
                         login: !!document.querySelector('a[href="/login"]'),
                         video: v ? { src: v.currentSrc, ready: v.readyState, playing: !v.paused } : null };
              });
              console.log(name, 'status', r?.status(), 'final', p.url(), JSON.stringify(info));
              await p.screenshot({ path: `${name}.png` });
            } catch (e) { console.log(name, 'ERROR', e.message.split('\n')[0]); }
          }
          await b.close();
          JS
          node shot.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: '*.png'
